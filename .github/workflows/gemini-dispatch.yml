name: Gemini Dispatch

# On-demand AI collaborator: mention `@gemini-cli <task>` in any issue or PR
# comment and Gemini will execute it (project instructions live in GEMINI.md).
# Requires a `GEMINI_API_KEY` repository secret (get one at Google AI Studio).
# Optional repository variables: GEMINI_MODEL, GEMINI_CLI_VERSION.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  dispatch:
    # Only real users, only @gemini-cli mentions, only repo collaborators
    # (prevents strangers from burning through the API quota).
    if: >-
      github.event.sender.type == 'User' &&
      contains(github.event.comment.body, '@gemini-cli') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gemini-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.comment.id }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout PR head
        if: github.event.issue.pull_request || github.event.pull_request
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number || github.event.pull_request.number }}/head

      - name: Checkout default branch
        if: ${{ !(github.event.issue.pull_request || github.event.pull_request) }}
        uses: actions/checkout@v4

      - name: Run Gemini CLI
        id: run_gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ vars.GEMINI_MODEL }}
          gemini_cli_version: ${{ vars.GEMINI_CLI_VERSION }}
          github_pr_number: ${{ github.event.pull_request.number || github.event.issue.number }}
          github_issue_number: ${{ github.event.issue.number }}
          settings: '{"model": {"maxSessionTurns": 25}}'
          prompt: |-
            You are working in the repository ${{ github.repository }}, already checked out
            (at the PR head when the request comes from a pull request).
            Project instructions are in GEMINI.md at the repo root — read and follow them.
            A collaborator wrote the request below (it starts with @gemini-cli; the rest is the task):
            ${{ github.event.comment.body }}
            Rules: if the task needs code changes, make them in the working tree and
            commit + push to the current branch; otherwise just answer. Always reply
            in Russian. Start your summary with a one-line verdict.

      - name: Post result as comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |-
            const summary = `${{ steps.run_gemini.outputs.summary }}`;
            const error = `${{ steps.run_gemini.outputs.error }}`;
            const body = ('### 🤖 Gemini\n\n' + (summary || '*No output.*') +
              (error ? `\n\n<details><summary>Errors</summary>\n\n\`\`\`\n${error.slice(0, 3000)}\n\`\`\`\n</details>` : '')
            ).slice(0, 60000);
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue?.number || context.payload.pull_request?.number;
            if (issue_number) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
